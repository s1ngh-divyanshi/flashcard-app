<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevCards - Interactive Study Deck</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <h1>DevCards</h1>
      <div class="header-actions">
        <button id="add-card-btn" class="btn btn-secondary">+ Add Card</button>
        <button id="shuffle-btn" class="btn btn-secondary">Shuffle</button>
      </div>
    </header>

    <div class="progress-bar-container">
      <div id="progress-bar" class="progress-bar"></div>
    </div>

    <div class="stats-bar">
      <span id="deck-counter">Card 1 of 5</span>
      <span id="category-badge" class="badge">General</span>
    </div>

    <!-- 3D Card Stage -->
    <main class="flashcard-stage">
      <div id="flashcard" class="flashcard">
        <div class="flashcard-face flashcard-front">
          <div class="card-label">QUESTION</div>
          <p id="card-question" class="card-text">Loading question...</p>
          <span class="hint-text">Click or press Space to flip</span>
        </div>
        <div class="flashcard-face flashcard-back">
          <div class="card-label">ANSWER</div>
          <p id="card-answer" class="card-text">Loading answer...</p>
          <span class="hint-text">Click or press Space to flip back</span>
        </div>
      </div>
    </main>

    <!-- Controls -->
    <footer class="controls-container">
      <button id="prev-btn" class="btn btn-nav">&larr; Previous</button>
      <button id="flip-btn" class="btn btn-primary">Flip Card</button>
      <button id="next-btn" class="btn btn-nav">Next &rarr;</button>
    </footer>
  </div>

  <!-- Add Card Modal -->
  <dialog id="card-modal" class="modal">
    <form id="add-card-form" method="dialog">
      <h2>Add New Flashcard</h2>
      <label for="input-category">Category</label>
      <input type="text" id="input-category" placeholder="e.g., C++, Web, Algorithms" required>

      <label for="input-question">Question</label>
      <textarea id="input-question" rows="3" placeholder="Enter question..." required></textarea>

      <label for="input-answer">Answer</label>
      <textarea id="input-answer" rows="3" placeholder="Enter answer..." required></textarea>

      <div class="modal-actions">
        <button type="button" id="modal-cancel-btn" class="btn btn-secondary">Cancel</button>
        <button type="submit" class="btn btn-primary">Save Card</button>
      </div>
    </form>
  </dialog>

  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
